---
layout: default
---
<a href="{{ '/' | relative_url }}" class="back-link">&larr; back to write-ups</a>

<div class="prompt-bar">
  <span class="dot"></span><span class="dot"></span><span class="dot"></span>
  &nbsp;itstallam@github &mdash; writeups/{{ page.slug }}
</div>

<h1><span class="accent">{{ page.title }}</span></h1>
<p class="subtitle">{{ page.tagline }}</p>

<div class="badge-row tag-row">
  <span class="tag">{{ page.category }}</span>
  <span class="tag">{{ page.difficulty }}</span>
  <span class="tag">{{ page.platform }}</span>
  <span class="tag">{{ page.date | date: "%b %-d, %Y" }}</span>
</div>

<article class="writeup-body">
  {{ content }}
</article>
