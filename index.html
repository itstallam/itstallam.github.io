<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>itstallam :: write-ups</title>
<meta name="description" content="Penetration testing and CTF write-up index for itstallam.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:            #0a0c09;
    --bg-panel:      #12140f;
    --bg-panel-hov:  #171a12;
    --hairline:      #262a1e;
    --text:          #e8e6dc;
    --text-muted:    #8a8f7f;
    --text-dim:      #565b4c;
    --amber:         #ffb000;
    --amber-dim:     #7a5300;
    --amber-glow:    rgba(255,176,0,0.14);
    --danger:        #ff5a4e;
    --radius:        3px;
    --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
    --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  *{ box-sizing:border-box; }

  html{ scroll-behavior:smooth; }

  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, var(--amber-glow), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    line-height:1.5;
    min-height:100vh;
  }

  a{ color:inherit; }

  ::selection{ background:var(--amber); color:#000; }

  :focus-visible{
    outline:2px solid var(--amber);
    outline-offset:2px;
  }

  .wrap{
    max-width:960px;
    margin:0 auto;
    padding:64px 24px 96px;
  }

  /* ---------- header / terminal hero ---------- */

  .prompt-bar{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:var(--mono);
    font-size:13px;
    color:var(--text-dim);
    margin-bottom:18px;
    letter-spacing:0.02em;
  }
  .prompt-bar .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--hairline);
  }

  .terminal{
    font-family:var(--mono);
    font-size:clamp(13px, 2.4vw, 16px);
    color:var(--text-muted);
    white-space:pre-wrap;
    min-height:7.5em;
  }
  .terminal .prompt{ color:var(--amber); }
  .terminal .path{ color:var(--text); }
  .terminal .ok{ color:#7fdc7f; }
  .terminal .cursor{
    display:inline-block;
    width:8px; height:1.1em;
    background:var(--amber);
    vertical-align:text-bottom;
    margin-left:2px;
    animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  h1{
    font-family:var(--mono);
    font-weight:700;
    font-size:clamp(28px, 5vw, 44px);
    letter-spacing:-0.01em;
    margin:28px 0 6px;
    color:var(--text);
  }
  h1 .veni{ color:var(--amber); }

  .subtitle{
    color:var(--text-muted);
    font-size:15px;
    max-width:58ch;
    margin:0 0 40px;
  }

  /* ---------- controls ---------- */

  .controls{
    display:flex;
    align-items:center;
    gap:10px;
    border:1px solid var(--hairline);
    background:var(--bg-panel);
    border-radius:var(--radius);
    padding:10px 14px;
    margin-bottom:36px;
  }
  .controls label{
    font-family:var(--mono);
    color:var(--amber);
    font-size:13px;
    white-space:nowrap;
  }
  .controls input{
    flex:1;
    background:transparent;
    border:none;
    color:var(--text);
    font-family:var(--mono);
    font-size:14px;
    outline:none;
  }
  .controls input::placeholder{ color:var(--text-dim); }
  .controls .count{
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-dim);
    white-space:nowrap;
  }

  /* ---------- grid / cards ---------- */

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(270px, 1fr));
    gap:14px;
  }

  .card{
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    gap:16px;
    background:var(--bg-panel);
    border:1px solid var(--hairline);
    border-left:2px solid var(--hairline);
    border-radius:var(--radius);
    padding:18px 18px 16px;
    text-decoration:none;
    color:inherit;
    opacity:0;
    transform:translateY(6px);
    animation:reveal 0.4s ease forwards;
    transition:border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
  }
  .card:hover, .card:focus-visible{
    border-left-color:var(--amber);
    background:var(--bg-panel-hov);
    transform:translateY(-2px);
  }
  @keyframes reveal{ to{ opacity:1; transform:translateY(0); } }

  .card-top{ display:flex; flex-direction:column; gap:8px; }

  .card-name{
    font-family:var(--mono);
    font-weight:600;
    font-size:15px;
    color:var(--text);
    word-break:break-word;
  }
  .card-name .accent{ color:var(--amber); }

  .card-desc{
    font-size:13.5px;
    color:var(--text-muted);
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .card-meta{
    display:flex;
    flex-wrap:wrap;
    gap:8px 14px;
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .card-meta span{ display:inline-flex; align-items:center; gap:5px; }
  .lang-dot{ width:7px; height:7px; border-radius:50%; background:var(--amber-dim); }

  .card-cta{
    font-family:var(--mono);
    font-size:12px;
    color:var(--amber);
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-top:1px solid var(--hairline);
    padding-top:12px;
  }
  .card-cta .badge{
    font-size:10px;
    color:var(--text-dim);
    border:1px solid var(--hairline);
    border-radius:2px;
    padding:2px 6px;
    text-transform:uppercase;
    letter-spacing:0.05em;
  }

  .empty, .error{
    font-family:var(--mono);
    color:var(--text-dim);
    font-size:14px;
    padding:40px 0;
    text-align:center;
  }
  .error{ color:var(--danger); }

  footer{
    margin-top:72px;
    padding-top:20px;
    border-top:1px solid var(--hairline);
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-dim);
  }
  footer a{ color:var(--text-muted); text-decoration:none; }
  footer a:hover{ color:var(--amber); }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    .cursor{ animation:none; }
    .card{ animation:none; opacity:1; transform:none; }
  }
</style>
</head>
<body>

  <div class="wrap">

    <div class="prompt-bar">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      &nbsp;itstallam@github &mdash; write-up-index
    </div>

    <div class="terminal" id="terminal" aria-live="polite"></div>

    <h1><span class="veni">VENI VIDI VICI</span></h1>
    <p class="subtitle">
      A running index of penetration testing walkthroughs and CTF write-ups &mdash;
      pulled live from GitHub, so it's never out of date.
    </p>

    <div class="controls">
      <label for="filter">grep -i</label>
      <input id="filter" type="text" placeholder="filter by name, language, or topic&hellip;" autocomplete="off">
      <span class="count" id="count"></span>
    </div>

    <div id="grid" class="grid" hidden></div>
    <div id="empty" class="empty" hidden>No matches. Try a different filter.</div>
    <div id="error" class="error" hidden></div>

    <footer>
      <span id="genline">&mdash;</span>
      <a href="https://github.com/itstallam" target="_blank" rel="noopener">github.com/itstallam &rarr;</a>
    </footer>

  </div>

<script>
(function(){
  const USERNAME = "itstallam";

  // Optional: set this to a GitHub topic (e.g. "writeup") to only show
  // repos tagged with it. Leave empty to show every public, non-fork repo.
  const TOPIC_FILTER = "";

  // Repos to always hide from the grid (your profile repo, etc.)
  const HIDE = new Set([`${USERNAME}.github.io`]);

  const termEl   = document.getElementById('terminal');
  const gridEl   = document.getElementById('grid');
  const emptyEl  = document.getElementById('empty');
  const errorEl  = document.getElementById('error');
  const filterEl = document.getElementById('filter');
  const countEl  = document.getElementById('count');
  const genline  = document.getElementById('genline');

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function typeLines(lines, onDone){
    if(reduceMotion){
      termEl.innerHTML = lines.map(renderLine).join('\n');
      onDone && onDone();
      return;
    }
    let li = 0, ci = 0, out = '';
    (function step(){
      if(li >= lines.length){ termEl.innerHTML = out; onDone && onDone(); return; }
      const raw = lines[li].text;
      if(ci <= raw.length){
        out = lines.slice(0, li).map(renderLine).join('\n')
              + (li>0 ? '\n' : '')
              + renderLine({ ...lines[li], text: raw.slice(0, ci) })
              + '<span class="cursor"></span>';
        termEl.innerHTML = out;
        ci++;
        setTimeout(step, lines[li].speed || 14);
      } else {
        li++; ci = 0;
        setTimeout(step, 120);
      }
    })();
  }

  function renderLine(l){
    const cls = l.cls ? ` class="${l.cls}"` : '';
    return `<span${cls}>${l.prefix || ''}${escapeHtml(l.text)}</span>`;
  }

  function escapeHtml(s){
    return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  }

  function timeAgo(iso){
    const d = (Date.now() - new Date(iso).getTime()) / 1000;
    const units = [[31536000,'y'],[2592000,'mo'],[604800,'w'],[86400,'d'],[3600,'h'],[60,'m']];
    for(const [s, label] of units){ if(d >= s) return `${Math.floor(d/s)}${label} ago`; }
    return 'just now';
  }

  // Checks whether a project's Pages site actually responds, instead of
  // trusting the GitHub API's `has_pages` flag (which can lag several
  // minutes behind a freshly-enabled Pages site returning its first build).
  // Same-origin (both live under itstallam.github.io), so no CORS issue.
  function checkLive(url, timeoutMs = 4000){
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    return fetch(url, { method: 'HEAD', cache: 'no-store', signal: controller.signal })
      .then(res => res.ok)
      .catch(() => false)
      .finally(() => clearTimeout(timer));
  }

  async function resolveLinks(repos){
    await Promise.all(repos.map(async repo => {
      const pagesUrl = `https://${USERNAME}.github.io/${repo.name}/`;
      const live = repo.has_pages ? await checkLive(pagesUrl) : false;
      repo._liveUrl = live ? pagesUrl : repo.html_url;
      repo._isLive = live;
    }));
    return repos;
  }

  let allRepos = [];

  function render(list){
    gridEl.innerHTML = '';
    if(list.length === 0){
      gridEl.hidden = true;
      emptyEl.hidden = false;
      countEl.textContent = '0 results';
      return;
    }
    emptyEl.hidden = true;
    gridEl.hidden = false;
    countEl.textContent = `${list.length} repo${list.length===1?'':'s'}`;

    list.forEach((repo, i) => {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = repo._liveUrl || repo.html_url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.style.animationDelay = `${Math.min(i*40, 400)}ms`;

      const desc = repo.description ? escapeHtml(repo.description) : 'No description provided.';
      const lang = repo.language || '—';
      const isLive = repo._isLive;

      a.innerHTML = `
        <div class="card-top">
          <div class="card-name">$ <span class="accent">${escapeHtml(repo.name)}</span></div>
          <div class="card-desc">${desc}</div>
        </div>
        <div>
          <div class="card-meta">
            <span><span class="lang-dot"></span>${escapeHtml(lang)}</span>
            <span>★ ${repo.stargazers_count}</span>
            <span>updated ${timeAgo(repo.updated_at)}</span>
          </div>
        </div>
        <div class="card-cta">
          <span>${isLive ? 'view report' : 'view source'} &rarr;</span>
          <span class="badge">${isLive ? 'pages' : 'repo'}</span>
        </div>
      `;
      gridEl.appendChild(a);
    });
  }

  filterEl.addEventListener('input', () => {
    const q = filterEl.value.trim().toLowerCase();
    if(!q){ render(allRepos); return; }
    render(allRepos.filter(r =>
      r.name.toLowerCase().includes(q) ||
      (r.description || '').toLowerCase().includes(q) ||
      (r.language || '').toLowerCase().includes(q) ||
      (r.topics || []).some(t => t.toLowerCase().includes(q))
    ));
  });

  async function load(){
    try{
      const res = await fetch(`https://api.github.com/users/${USERNAME}/repos?per_page=100&sort=updated`, {
        headers: { 'Accept': 'application/vnd.github+json' }
      });
      if(!res.ok) throw new Error(`GitHub API responded ${res.status}`);
      const data = await res.json();

      allRepos = data.filter(r =>
        !r.fork &&
        !HIDE.has(r.name) &&
        (!TOPIC_FILTER || (r.topics || []).includes(TOPIC_FILTER))
      );

      await resolveLinks(allRepos);

      render(allRepos);
      genline.textContent = `generated ${new Date().toLocaleString()} · ${allRepos.length} repos indexed`;
    } catch(err){
      errorEl.hidden = false;
      errorEl.textContent = `! failed to reach github api — ${err.message}`;
      genline.textContent = 'index unavailable';
    }
  }

  typeLines([
    { prefix: '<span class="prompt">$</span> ', text: `curl api.github.com/users/${USERNAME}/repos`, cls: '' },
    { prefix: '', text: 'scanning public repositories...', cls: '' },
    { prefix: '', text: 'probing pages endpoints...', cls: '' },
    { prefix: '', text: 'done.', cls: 'ok' }
  ], load);

})();
</script>
</body>
</html>
